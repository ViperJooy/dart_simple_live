name: Build All Platforms

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Build APK
        working-directory: simple_live_app
        run: flutter build apk --release --split-per-abi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_app-android-apk
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

  build-tv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Generate debug keystore for TV
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/tvkey.jks" -alias tvkey \
            -keyalg RSA -keysize 2048 -validity 36500 -storepass simplelive -keypass simplelive \
            -dname "CN=SimpleLive TV, OU=Dev, O=Dev, L=Net, ST=Net, C=CN"
          echo "storeFile=$GITHUB_WORKSPACE/tvkey.jks" > simple_live_tv_app/android/key.properties
          echo "storePassword=simplelive" >> simple_live_tv_app/android/key.properties
          echo "keyPassword=simplelive" >> simple_live_tv_app/android/key.properties
          echo "keyAlias=tvkey" >> simple_live_tv_app/android/key.properties
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Build TV APK
        working-directory: simple_live_tv_app
        run: flutter build apk --release --split-per-abi
      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_tv-android-apk
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      - name: Enable git long paths
        run: git config --global core.longpaths true
      - name: Restore Packages
        working-directory: simple_live_app
        run: flutter pub get
      - name: Build Windows
        working-directory: simple_live_app
        run: flutter build windows --release
      - name: Create archive
        working-directory: simple_live_app
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/simple_live_app-windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_app-windows-x64
          path: simple_live_app/build/simple_live_app-windows-x64.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv
      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop
      - name: Restore Packages
        working-directory: simple_live_app
        run: flutter pub get
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      - name: Build Linux
        working-directory: simple_live_app
        run: flutter_distributor package --platform linux --targets deb,zip --skip-clean
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_app-linux
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop
      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get
      - name: Install appdmg
        run: npm install -g appdmg
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      - name: Build MacOS
        working-directory: simple_live_app
        run: flutter_distributor package --platform macos --targets dmg,zip --skip-clean
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_app-macos
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Build IPA
        working-directory: simple_live_app
        run: flutter build ios --release --no-codesign
      - name: Create IPA
        working-directory: simple_live_app
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_app-ios
          path: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

  build-console:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Get dependencies
        working-directory: simple_live_console
        run: dart pub get
      - name: Build Windows x64 bundle
        working-directory: simple_live_console
        run: dart build cli --target=bin/simple_live_console.dart --target-os=windows --target-arch=x64 --output=build/windows_x64
      - name: Create archive
        working-directory: simple_live_console
        run: Compress-Archive -Path build/windows_x64/bundle -DestinationPath build/simple_live_console-windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_console-windows-x64
          path: simple_live_console/build/simple_live_console-windows-x64.zip

  upload-openlist:
    needs: [build-android, build-tv, build-windows, build-linux, build-macos, build-ios, build-console]
    if: github.repository_owner == 'ViperJooy'
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts (keep per-artifact dirs)
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename and collect files
        run: |
          cd artifacts
          # 手机 APK
          if [ -d simple_live_app-android-apk ]; then
            for f in simple_live_app-android-apk/app-*.apk; do mv "$f" "simple_live_app-$(basename $f)"; done
          fi
          # TV APK
          if [ -d simple_live_tv-android-apk ]; then
            for f in simple_live_tv-android-apk/app-*.apk; do mv "$f" "simple_live_tv-$(basename $f)"; done
          fi
          # Linux / macOS 带版本号的产物改成固定名，保证每次构建都是覆盖同一批文件
          if [ -d simple_live_app-linux ]; then
            mv simple_live_app-linux/*.deb simple_live_app-linux/simple_live_app-linux.deb 2>/dev/null || true
            mv simple_live_app-linux/*.zip simple_live_app-linux/simple_live_app-linux.zip 2>/dev/null || true
          fi
          if [ -d simple_live_app-macos ]; then
            mv simple_live_app-macos/*.dmg simple_live_app-macos/simple_live_app-macos.dmg 2>/dev/null || true
            mv simple_live_app-macos/*.zip simple_live_app-macos/simple_live_app-macos.zip 2>/dev/null || true
          fi
          # iOS 固定名
          if [ -f simple_live_app-ios/ios_no_sign.ipa ]; then
            mv simple_live_app-ios/ios_no_sign.ipa simple_live_app-ios/simple_live_app-ios.ipa
          fi
          find . -type f | sort

      - name: Upload to OpenList
        env:
          OL_AUTH: ${{ secrets.OPENLIST_TOKEN }}
        run: |
          set -e
          BASE="https://alist.viper.pub"
          DIR="/localhost/apk/simple_live"
          find artifacts -type f | while read -r f; do
            name=$(basename "$f")
            upath=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$DIR/$name")
            echo "upload $name"
            curl -sf -m 1800 -X PUT "$BASE/api/fs/put" \
              -H "Authorization: $OL_AUTH" \
              -H "File-Path: $upath" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f"
            echo
          done
